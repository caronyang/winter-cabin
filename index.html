<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>冬日小屋・微縮雪景 360°</title>
<style>
  :root{
    --ink:#4a4453;
    --ink-soft:#7a7286;
    --line:rgba(255,255,255,.65);
    --glass:rgba(255,255,255,.55);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    font-family:"Segoe UI","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,#f8e7e7 0%,#f3e8ee 45%,#dde4f4 100%);
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;outline:none}

  .hud{position:fixed;z-index:5;pointer-events:none}
  .title{top:26px;left:30px}
  .title h1{
    margin:0;font-size:20px;font-weight:600;letter-spacing:.14em;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
  }
  .title p{
    margin:7px 0 0;font-size:11.5px;letter-spacing:.22em;color:var(--ink-soft);
    text-transform:uppercase;
  }

  .bar{
    bottom:58px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;pointer-events:auto;
    padding:7px;border-radius:999px;
    background:rgba(255,255,255,.5);
    border:1px solid rgba(255,255,255,.75);
    box-shadow:0 10px 30px rgba(90,74,110,.14), inset 0 1px 0 rgba(255,255,255,.8);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  .bar button{
    appearance:none;border:0;background:transparent;color:var(--ink);
    font:inherit;font-size:12.5px;letter-spacing:.06em;
    padding:9px 15px;border-radius:999px;cursor:pointer;
    display:flex;align-items:center;gap:7px;
    transition:background .2s ease, color .2s ease, transform .12s ease;
    white-space:nowrap;
  }
  .bar button:hover{background:rgba(255,255,255,.85)}
  .bar button:active{transform:scale(.97)}
  .bar button.on{background:rgba(120,148,196,.22);color:#3c4a66}
  .bar svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;opacity:.85}

  .panel{
    top:26px;right:26px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;
    pointer-events:auto;
  }
  .seg{
    display:flex;gap:4px;padding:5px;border-radius:999px;
    background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.75);
    box-shadow:0 10px 30px rgba(90,74,110,.14), inset 0 1px 0 rgba(255,255,255,.8);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:background .5s ease,border-color .5s ease;
  }
  .seg button{
    appearance:none;border:0;background:transparent;color:inherit;font:inherit;
    font-size:12px;letter-spacing:.08em;padding:7px 13px;border-radius:999px;cursor:pointer;
    transition:background .2s ease,color .2s ease,transform .12s ease;white-space:nowrap;
  }
  .seg button:hover{background:rgba(255,255,255,.8)}
  .seg button:active{transform:scale(.97)}
  .seg button.on{background:rgba(120,148,196,.24);color:#3c4a66}

  body.night{ --ink:#e9eefb; --ink-soft:#a7b4cc; }
  body.night .bar, body.night .seg{
    background:rgba(24,32,50,.55);border-color:rgba(255,255,255,.14);
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1);
  }
  body.night .bar button, body.night .seg button{ color:#e9eefb; }
  body.night .bar button:hover, body.night .seg button:hover{ background:rgba(255,255,255,.12); }
  body.night .bar button.on, body.night .seg button.on{ background:rgba(140,175,235,.26); color:#dbe7ff; }
  body.night .title h1{ text-shadow:none; }
  body.night .hint, body.night .credit{ color:rgba(210,222,240,.45); }
  body.night .toast{ background:rgba(232,240,252,.94); color:#243049; }
  body.dusk .bar, body.dusk .seg{ background:rgba(255,244,238,.55); border-color:rgba(255,255,255,.7); }

  .hint{
    bottom:26px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.16em;color:rgba(74,68,83,.45);
    white-space:nowrap;
  }
  .credit{
    right:26px;bottom:30px;font-size:10.5px;letter-spacing:.14em;
    color:rgba(74,68,83,.42);text-transform:uppercase;
  }

  #loader{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;
    background:linear-gradient(180deg,#f8e7e7 0%,#f3e8ee 45%,#dde4f4 100%);
    transition:opacity .7s ease;
  }
  #loader.gone{opacity:0;pointer-events:none}
  .flake{
    width:34px;height:34px;border-radius:50%;
    border:2px solid rgba(120,148,196,.28);
    border-top-color:#8aa3cf;animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader span{font-size:11.5px;letter-spacing:.28em;color:var(--ink-soft)}

  .toast{
    position:fixed;left:50%;bottom:104px;z-index:30;pointer-events:none;
    transform:translateX(-50%) translateY(8px);
    padding:9px 16px;border-radius:999px;
    background:rgba(74,68,83,.86);color:#fff;
    font-size:12px;letter-spacing:.08em;white-space:nowrap;
    opacity:0;transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 8px 24px rgba(74,68,83,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:640px){
    .title{top:18px;left:18px}
    .title h1{font-size:16px}
    .title p{font-size:9.5px;letter-spacing:.16em}
    .credit{display:none}
    .bar button{padding:8px 11px;font-size:11.5px}
    .bar button span{display:none}
    .hint{font-size:9.5px;letter-spacing:.1em}
    .panel{top:64px;right:12px}
    .seg{padding:4px}
    .seg button{padding:6px 9px;font-size:11px}
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud title">
  <h1>冬日小屋</h1>
  <p>Miniature Winter Diorama</p>
</div>

<div class="hud panel">
  <div class="seg" id="segTime" role="group" aria-label="時段">
    <button data-v="day" class="on">白天</button>
    <button data-v="dusk">黃昏</button>
    <button data-v="night">黑夜</button>
  </div>
  <div class="seg" id="segSnow" role="group" aria-label="雪量">
    <button data-v="light" class="on">小雪</button>
    <button data-v="heavy">大雪</button>
  </div>
</div>

<div class="hud bar">
  <button id="btnRot" class="on" title="自動旋轉">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    <span>自動旋轉</span>
  </button>
  <button id="btnReset" title="重設視角">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg>
    <span>重設視角</span>
  </button>
  <button id="btnShot" title="儲存圖片">
    <svg viewBox="0 0 24 24"><path d="M4 8h3l1.6-2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13.4" r="3.2"/></svg>
    <span>儲存圖片</span>
  </button>
  <button id="btnMusic" title="背景音樂" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M9 17V5.5l9-1.8V15"/><circle cx="6.6" cy="17.4" r="2.5"/><circle cx="15.6" cy="15.4" r="2.5"/></svg>
    <span>音樂</span>
  </button>
</div>

<div class="hud hint">拖曳旋轉 · 滾輪縮放 · 右鍵平移</div>
<div class="hud credit">Blender Cycles · three.js</div>

<div id="toast" class="toast"></div>

<div id="loader"><div class="flake"></div><span>正在堆雪…</span></div>

<script type="importmap">
{
  "imports": {
    "three": "./libs/three.module.js",
    "three/addons/": "./libs/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('stage');

/* ---------------- renderer ---------------- */
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, alpha: false, preserveDrawingBuffer: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

/* ---------------- scene ---------------- */
const scene = new THREE.Scene();

const SKY = {
  day:   ['#f7ded8', '#efdee9', '#dbe0f2', '#c9d6ef'],
  dusk:  ['#ffcf9f', '#f6b3ab', '#cf9fc4', '#8b8cc2'],
  night: ['#070c18', '#0e1830', '#182440', '#2a3a5a']
};

function skyTexture(stops){
  const c = document.createElement('canvas');
  c.width = 8; c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, stops[0]);
  g.addColorStop(0.42, stops[1]);
  g.addColorStop(0.72, stops[2]);
  g.addColorStop(1.00, stops[3]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, 8, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = skyTexture(SKY.day);

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 400);

const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.05);
scene.environment = envRT.texture;
if ('environmentIntensity' in scene) scene.environmentIntensity = 0.12;

/* ---------------- lights ---------------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0xd8d2e8, 0.3);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dc, 1.75);
key.position.set(9, 17, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -13; key.shadow.camera.right = 13;
key.shadow.camera.top = 13; key.shadow.camera.bottom = -13;
key.shadow.camera.near = 1; key.shadow.camera.far = 60;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.035;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0xd4e2ff, 0.45);
fill.position.set(-11, 8, 5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xe9f1ff, 0.38);
rim.position.set(-3, 9, -13);
scene.add(rim);

// dim light from below so the rocky underside never goes pitch black
const bounce = new THREE.DirectionalLight(0xf3e6d8, 0.3);
bounce.position.set(3, -12, 7);
scene.add(bounce);

/* ---------------- day / dusk / night presets ---------------- */
const PRESETS = {
  day: {
    keyC: 0xfff1dc, keyI: 1.75, keyPos: [9, 17, 9],
    fillC: 0xd4e2ff, fillI: 0.45,
    rimC: 0xe9f1ff, rimI: 0.38,
    hemiSky: 0xffffff, hemiGnd: 0xd8d2e8, hemiI: 0.30,
    env: 0.12, exposure: 0.92, glow: 0.23,
    bloomS: 0.32, bloomT: 1.20, bloomR: 0.55,
    stars: 0, moon: 0, snowOpacity: 0.90, snowColor: 0xffffff,
    bounceC: 0xf3e6d8, bounceI: 0.30, blob: 0.8
  },
  dusk: {
    keyC: 0xffb070, keyI: 2.05, keyPos: [15, 6.5, 10],
    fillC: 0xb09ae0, fillI: 0.55,
    rimC: 0xffc2cf, rimI: 0.62,
    hemiSky: 0xffd2ba, hemiGnd: 0x6b5a82, hemiI: 0.36,
    env: 0.10, exposure: 0.96, glow: 0.34,
    bloomS: 0.55, bloomT: 1.05, bloomR: 0.60,
    stars: 0.18, moon: 0.35, snowOpacity: 0.95, snowColor: 0xffe6dd,
    bounceC: 0xffc9a8, bounceI: 0.34, blob: 0.55
  },
  night: {
    keyC: 0xa8c4f5, keyI: 0.85, keyPos: [10, 16, 7],
    fillC: 0x3d5a99, fillI: 0.45,
    rimC: 0x7fa4e0, rimI: 0.30,
    hemiSky: 0x46598a, hemiGnd: 0x151b28, hemiI: 0.32,
    env: 0.06, exposure: 1.06, glow: 0.55,
    bloomS: 0.85, bloomT: 0.95, bloomR: 0.65,
    stars: 1, moon: 1, snowOpacity: 1.0, snowColor: 0xcddfff,
    bounceC: 0x6d88c0, bounceI: 0.26, blob: 0.12
  }
};

const targets = {
  keyC: new THREE.Color(0xfff1dc), keyI: 1.75, keyPos: new THREE.Vector3(9, 17, 9),
  fillC: new THREE.Color(0xd4e2ff), fillI: 0.45,
  rimC: new THREE.Color(0xe9f1ff), rimI: 0.38,
  hemiSky: new THREE.Color(0xffffff), hemiGnd: new THREE.Color(0xd8d2e8), hemiI: 0.30,
  env: 0.12, exposure: 0.92, glow: 0.23,
  bloomS: 0.32, bloomT: 1.20, bloomR: 0.55,
  stars: 0, moon: 0, snowOpacity: 0.90, snowColor: new THREE.Color(0xffffff),
  bounceC: new THREE.Color(0xf3e6d8), bounceI: 0.30, blob: 0.8
};
let tod = 'day';
let curGlow = 0.23;
const glowMats = [];

/* ---------------- soft shadow blob ---------------- */
function radialTex(inner, outer){
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0, inner);
  g.addColorStop(0.55, outer);
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const blob = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({
    map: radialTex('rgba(120,108,140,.34)', 'rgba(120,108,140,.10)'),
    transparent: true, depthWrite: false
  })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = -6.4;
scene.add(blob);

/* ---------------- stars + moon ---------------- */
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(300 * 3);
for (let i = 0; i < 300; i++){
  const r = 120 + Math.random() * 55;
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(0.05 + Math.random() * 0.92);
  starPos[i*3]   = Math.sin(ph) * Math.cos(th) * r;
  starPos[i*3+1] = Math.cos(ph) * r;
  starPos[i*3+2] = Math.sin(ph) * Math.sin(th) * r;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({
  size: 1.7, sizeAttenuation: false, color: 0xdfe8ff,
  transparent: true, opacity: 0, depthWrite: false
});
const stars = new THREE.Points(starGeo, starMat);
stars.visible = false;
scene.add(stars);

const moon = new THREE.Sprite(new THREE.SpriteMaterial({
  map: radialTex('rgba(255,255,255,1)', 'rgba(198,220,255,.45)'),
  color: 0xdbe7ff, transparent: true, opacity: 0, depthWrite: false,
  blending: THREE.AdditiveBlending
}));
moon.scale.setScalar(18);
moon.position.set(66, 78, -100);
moon.visible = false;
scene.add(moon);

/* ---------------- snow ---------------- */
const FLAKE_LIGHT = 420;
const FLAKE_HEAVY = 1250;
const flakeGeo = new THREE.BufferGeometry();
const pos = new Float32Array(FLAKE_HEAVY * 3);
const spd = new Float32Array(FLAKE_HEAVY);
// snowfall column: a disc hugging the diorama, starting just above the chimney
const SNOW_R = 8.3, TOP = 7.9, BOT = -0.3;
function spawnFlake(i, atTop){
  const a = Math.random() * Math.PI * 2;
  const rr = SNOW_R * Math.sqrt(Math.random());
  pos[i*3]   = Math.cos(a) * rr;
  pos[i*3+2] = Math.sin(a) * rr;
  pos[i*3+1] = atTop ? TOP : Math.random() * (TOP - BOT) + BOT;
}
for (let i = 0; i < FLAKE_HEAVY; i++){
  spawnFlake(i, false);
  spd[i] = 0.55 + Math.random() * 0.95;
}
flakeGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
flakeGeo.setDrawRange(0, FLAKE_LIGHT);
let snowMode = 'light';
function snowTexture(){
  const sz = 128;
  const c = document.createElement('canvas');
  c.width = c.height = sz;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.45, 'rgba(250,253,255,0.95)');
  g.addColorStop(0.74, 'rgba(202,216,240,0.55)');
  g.addColorStop(1.00, 'rgba(188,204,232,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, sz, sz);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const flakeMat = new THREE.PointsMaterial({
  size: 0.16, map: snowTexture(),
  transparent: true, depthWrite: false, opacity: 0.9,
  sizeAttenuation: true, color: 0xffffff
});
const flakes = new THREE.Points(flakeGeo, flakeMat);
scene.add(flakes);

/* ---------------- controls ---------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.85;
controls.zoomSpeed = 0.8;
controls.panSpeed = 0.6;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI * 0.545;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 1.0, 0);

/* ---------------- load model ---------------- */
let model = null, homeDist = 30, homePos = new THREE.Vector3();
const loader = new GLTFLoader();
const loaderEl = document.getElementById('loader');

function fitCamera(){
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  // centre horizontally, keep the snow line as the vertical anchor
  model.position.x -= center.x;
  model.position.z -= center.z;

  const fovV = THREE.MathUtils.degToRad(camera.fov);
  const fovH = 2 * Math.atan(Math.tan(fovV / 2) * camera.aspect);
  const spanY = Math.max(size.y * 1.15, 6);
  const distV = (spanY * 0.5) / Math.tan(fovV / 2);
  const distH = (Math.max(size.x, size.z) * 0.5) / Math.tan(fovH / 2);
  homeDist = Math.max(distV, distH) * 1.16;

  controls.target.set(0, 0.9, 0);
  controls.minDistance = homeDist * 0.42;
  controls.maxDistance = homeDist * 2.0;

  const sph = new THREE.Spherical(homeDist, THREE.MathUtils.degToRad(54.7), THREE.MathUtils.degToRad(45));
  homePos.setFromSpherical(sph).add(controls.target);
  camera.position.copy(homePos);
  camera.lookAt(controls.target);

  blob.scale.setScalar(Math.max(size.x, size.z) * 2.1);
  blob.position.y = box.min.y - 0.9;
}

loader.load('./winter_cabin.glb', (gltf) => {
  model = gltf.scene;
  model.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats){
      if (!m) continue;
      if (m.transparent && (m.opacity ?? 1) < 0.95) o.castShadow = false;
      if ('envMapIntensity' in m) m.envMapIntensity = 0.45;
      if (m.emissiveIntensity !== undefined && m.emissive && m.emissive.getHex() !== 0) {
        if (!glowMats.some(g => g.m === m)) glowMats.push({ m, base: m.emissiveIntensity });
        m.emissiveIntensity = m.emissiveIntensity * targets.glow;
      }
    }
  });
  scene.add(model);
  fitCamera();
  loaderEl.classList.add('gone');
  setTimeout(() => loaderEl.remove(), 800);
  window.__ready = true;
}, (ev) => {
  if (ev.total) {
    const pct = Math.min(99, Math.round(ev.loaded / ev.total * 100));
    loaderEl.querySelector('span').textContent = '正在堆雪… ' + pct + '%';
  }
}, (err) => {
  console.error(err);
  loaderEl.querySelector('span').textContent = '載入失敗，請確認 winter_cabin.glb 存在';
});

/* ---------------- bloom ---------------- */
let composer = null;
try {
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js')
  ]);
  const rt = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
    type: THREE.HalfFloatType, samples: 4
  });
  composer = new EffectComposer(renderer, rt);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.setSize(window.innerWidth, window.innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight), 0.32, 0.55, 1.2);
  composer.addPass(bloomPass);
  window.__bloom = bloomPass;
  composer.addPass(new OutputPass());
} catch (e) {
  console.warn('Bloom disabled:', e);
}

/* ---------------- ui ---------------- */
const btnRot = document.getElementById('btnRot');
btnRot.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  btnRot.classList.toggle('on', controls.autoRotate);
});

let tween = null;
document.getElementById('btnReset').addEventListener('click', () => {
  tween = {
    t: 0,
    from: camera.position.clone(),
    fromTarget: controls.target.clone(),
    to: homePos.clone(),
    toTarget: new THREE.Vector3(0, 0.9, 0)
  };
});

function toast(msg){
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2400);
}

document.getElementById('btnShot').addEventListener('click', () => {
  try {
    render();
    const url = canvas.toDataURL('image/png');
    const d = new Date();
    const zp = (n) => String(n).padStart(2, '0');
    const stamp = d.getFullYear() + zp(d.getMonth() + 1) + zp(d.getDate()) + '-'
                + zp(d.getHours()) + zp(d.getMinutes()) + zp(d.getSeconds());
    const a = document.createElement('a');
    a.href = url;
    a.download = 'winter-cabin-' + stamp + '.png';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('已儲存圖片，請看下載資料夾');
  } catch (err) {
    console.error(err);
    toast('儲存失敗：' + (err && err.message ? err.message : err));
  }
});

/* ---------------- theme + snow controls ---------------- */
const TIME_LABEL = { day: '白天', dusk: '黃昏', night: '黑夜' };
const SNOW_LABEL = { light: '小雪', heavy: '大雪' };

function swapSky(name){
  if (scene.background && scene.background.dispose) scene.background.dispose();
  scene.background = skyTexture(SKY[name] || SKY.day);
}

function syncUI(){
  document.querySelectorAll('#segTime button').forEach(b => b.classList.toggle('on', b.dataset.v === tod));
  document.querySelectorAll('#segSnow button').forEach(b => b.classList.toggle('on', b.dataset.v === snowMode));
}

function saveState(){
  try { localStorage.setItem('wc-viewer', JSON.stringify({ tod, snowMode, autoRotate: controls.autoRotate })); } catch (e) {}
}

function applyPreset(name, instant){
  const k = PRESETS[name] ? name : 'day';
  const p = PRESETS[k];
  tod = k;
  targets.keyC.setHex(p.keyC); targets.keyI = p.keyI; targets.keyPos.set(p.keyPos[0], p.keyPos[1], p.keyPos[2]);
  targets.fillC.setHex(p.fillC); targets.fillI = p.fillI;
  targets.rimC.setHex(p.rimC); targets.rimI = p.rimI;
  targets.hemiSky.setHex(p.hemiSky); targets.hemiGnd.setHex(p.hemiGnd); targets.hemiI = p.hemiI;
  targets.env = p.env; targets.exposure = p.exposure; targets.glow = p.glow;
  targets.bloomS = p.bloomS; targets.bloomT = p.bloomT; targets.bloomR = p.bloomR;
  targets.stars = p.stars; targets.moon = p.moon;
  targets.snowOpacity = p.snowOpacity; targets.snowColor.setHex(p.snowColor);
  targets.bounceC.setHex(p.bounceC); targets.bounceI = p.bounceI; targets.blob = p.blob;

  swapSky(k);
  document.body.classList.toggle('night', k === 'night');
  document.body.classList.toggle('dusk', k === 'dusk');

  if (instant){
    key.color.copy(targets.keyC); key.intensity = p.keyI; key.position.copy(targets.keyPos);
    fill.color.copy(targets.fillC); fill.intensity = p.fillI;
    rim.color.copy(targets.rimC); rim.intensity = p.rimI;
    hemi.color.copy(targets.hemiSky); hemi.groundColor.copy(targets.hemiGnd); hemi.intensity = p.hemiI;
    scene.environmentIntensity = p.env;
    renderer.toneMappingExposure = p.exposure;
    curGlow = p.glow;
    glowMats.forEach(g => { g.m.emissiveIntensity = g.base * curGlow; });
    starMat.opacity = p.stars; stars.visible = p.stars > 0.01;
    moon.material.opacity = p.moon; moon.visible = p.moon > 0.01;
    flakeMat.opacity = p.snowOpacity; flakeMat.color.copy(targets.snowColor);
    bounce.color.copy(targets.bounceC); bounce.intensity = p.bounceI;
    blob.material.opacity = p.blob;
    const bp = window.__bloom;
    if (bp) { bp.strength = p.bloomS; bp.threshold = p.bloomT; bp.radius = p.bloomR; }
  }
  syncUI();
  saveState();
}

function applySnow(mode){
  snowMode = mode === 'heavy' ? 'heavy' : 'light';
  const heavy = snowMode === 'heavy';
  flakeGeo.setDrawRange(0, heavy ? FLAKE_HEAVY : FLAKE_LIGHT);
  flakeMat.size = heavy ? 0.24 : 0.18;
  syncUI();
  saveState();
  toast(heavy ? '大雪模式' : '小雪模式');
}

document.querySelectorAll('#segTime button').forEach(b => {
  b.addEventListener('click', () => applyPreset(b.dataset.v));
});
document.querySelectorAll('#segSnow button').forEach(b => {
  b.addEventListener('click', () => applySnow(b.dataset.v));
});

/* ---------------- gentle generative music (Web Audio) ---------------- */
const Music = (() => {
  let ctx = null, master = null, wet = null, soften = null, noiseBuf = null, timer = null;
  let on = false, barTime = 0, barIndex = 0;

  const BPM = 104;                 // light and brisk, still gentle
  const BEAT = 60 / BPM;
  const BAR = BEAT * 4;

  // | C | G | Am | F | C | G | F | G |
  const PROG = [
    { bass: 48, tones: [60, 64, 67] },   // C
    { bass: 43, tones: [59, 62, 67] },   // G
    { bass: 45, tones: [60, 64, 69] },   // Am
    { bass: 41, tones: [60, 65, 69] },   // F
    { bass: 48, tones: [60, 64, 67] },   // C
    { bass: 43, tones: [59, 62, 67] },   // G
    { bass: 41, tones: [60, 65, 69] },   // F
    { bass: 43, tones: [59, 62, 67] }    // G
  ];

  // melody: [beat, midi, beats, velocity]
  const A = [
    [[0,79,.5,.92],[.5,76,.5,.72],[1,79,.5,.80],[1.5,81,.5,.74],[2,84,1,.95],[3,81,1,.82]],
    [[0,83,.5,.90],[.5,81,.5,.76],[1,79,1,.84],[2,74,2,.80]],
    [[0,81,.5,.86],[.5,84,.5,.92],[1,83,.5,.80],[1.5,81,.5,.76],[2,76,2,.80]],
    [[0,77,.5,.82],[.5,81,.5,.86],[1,84,1,.92],[2,81,2,.80]],
    [[0,79,.5,.92],[.5,76,.5,.72],[1,79,.5,.80],[1.5,81,.5,.74],[2,84,1,.95],[3,86,1,.86]],
    [[0,83,1,.90],[1,79,1,.84],[2,74,2,.80]],
    [[0,81,.5,.86],[.5,79,.5,.80],[1,77,1,.80],[2,81,2,.82]],
    [[0,79,2,.86],[2,74,2,.70]]
  ];
  const B = [
    [[0,76,1,.80],[1,79,1,.80],[2,84,1.5,.88],[3.5,81,.5,.72]],
    [[0,83,1,.82],[1,79,1,.80],[2,74,2,.74]],
    [[0,76,1,.76],[1,81,1,.80],[2,84,2,.86]],
    [[0,81,1,.80],[1,77,1,.78],[2,72,2,.70]],
    [[0,79,1,.86],[1,84,1,.90],[2,79,1,.80],[3,76,1,.75]],
    [[0,74,1,.80],[1,79,1,.82],[2,83,2,.86]],
    [[0,81,1,.80],[1,77,1,.78],[2,74,1,.74],[3,77,1,.78]],
    [[0,79,3,.80]]
  ];

  function impulse(seconds, decay){
    const rate = ctx.sampleRate;
    const len = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  function noise(){
    const len = Math.floor(ctx.sampleRate * 0.2);
    const b = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    return b;
  }

  function init(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();

    master = ctx.createGain();
    master.gain.value = 0;
    soften = ctx.createBiquadFilter();
    soften.type = 'lowpass';
    soften.frequency.value = 3600;
    soften.Q.value = 0.3;
    soften.connect(master);
    master.connect(ctx.destination);

    const conv = ctx.createConvolver();
    conv.buffer = impulse(2.2, 2.9);
    wet = ctx.createGain();
    wet.gain.value = 0.38;
    wet.connect(conv);
    conv.connect(master);

    noiseBuf = noise();
    barTime = ctx.currentTime + 0.15;
    barIndex = 0;
  }

  function piano(midi, t, dur, vol){
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const g = ctx.createGain();
    const atk = 0.012;
    const tail = Math.max(0.75, dur + 0.4);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(Math.max(vol * 0.45, 0.0003), t + 0.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + atk + tail);

    const pan = ctx.createStereoPanner();
    pan.pan.value = Math.max(-0.28, Math.min(0.28, (midi - 76) / 22));
    g.connect(pan);
    pan.connect(soften);
    pan.connect(wet);

    [[1, 1.0, 'sine'], [2, 0.20, 'sine'], [3, 0.05, 'sine']].forEach(([h, amp, type]) => {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.value = f * h;
      const og = ctx.createGain();
      og.gain.value = amp;
      o.connect(og);
      og.connect(g);
      o.start(t);
      o.stop(t + atk + tail + 0.05);
    });
  }

  function bass(midi, t){
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g);
    g.connect(soften);
    g.connect(wet);
    o.start(t);
    o.stop(t + 0.55);
  }

  function chord(tones, t, vol){
    tones.forEach((m) => {
      const f = 440 * Math.pow(2, (m - 69) / 12);
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      o.connect(g);
      g.connect(soften);
      g.connect(wet);
      o.start(t);
      o.stop(t + 0.45);
    });
  }

  // sleigh bell: short filtered noise burst
  function sleigh(t, vol){
    const src = ctx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 5600;
    bp.Q.value = 1.3;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3600;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    src.connect(bp);
    bp.connect(hp);
    hp.connect(g);
    g.connect(master);   // keep the sparkle out of the lowpass
    g.connect(wet);
    src.start(t);
    src.stop(t + 0.16);
  }

  function pad(tones, t, dur){
    tones.forEach((m) => {
      const f = 440 * Math.pow(2, (m - 12 - 69) / 12);
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.007, t + 1.2);
      g.gain.setValueAtTime(0.007, t + dur * 0.7);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.9);
      o.connect(g);
      g.connect(soften);
      g.connect(wet);
      o.start(t);
      o.stop(t + dur + 1.1);
    });
  }

  function scheduleBar(t, idx){
    const bar = idx % PROG.length;
    const ch = PROG[bar];
    const section = (Math.floor(idx / PROG.length) % 2 === 0) ? A : B;
    const line = section[bar];

    bass(ch.bass, t);
    bass(ch.bass, t + BEAT * 2);
    chord(ch.tones, t + BEAT, 0.020);
    chord(ch.tones, t + BEAT * 3, 0.016);

    [0.5, 1.5, 2.5, 3.5].forEach((b, i) => {
      sleigh(t + b * BEAT, i % 2 === 0 ? 0.022 : 0.032);
    });

    line.forEach(([b, m, d, v]) => piano(m, t + b * BEAT, d * BEAT, 0.056 * v));

    pad(ch.tones, t, BAR);
  }

  function schedule(){
    if (!ctx || !on) return;
    const ahead = ctx.currentTime + 1.8;
    if (barTime < ctx.currentTime) barTime = ctx.currentTime + 0.05;
    while (barTime < ahead){
      scheduleBar(barTime, barIndex);
      barIndex++;
      barTime += BAR;
    }
  }

  function fade(to, seconds){
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(Math.max(master.gain.value, 0.0001), t);
    master.gain.linearRampToValueAtTime(to, t + seconds);
  }

  function toggle(){
    if (!ctx) init();
    if (ctx.state !== 'running') { try { ctx.resume(); } catch (e) {} }
    on = !on;
    if (on){
      if (barTime < ctx.currentTime) barTime = ctx.currentTime + 0.12;
      fade(0.21, 2.2);
      if (!timer) timer = setInterval(schedule, 250);
      schedule();
    } else {
      fade(0.0001, 0.9);
      if (timer) { clearInterval(timer); timer = null; }
    }
    try { localStorage.setItem('wc-music', on ? '1' : '0'); } catch (e) {}
    return on;
  }

  return {
    toggle,
    isOn(){ return on; },
    get context(){ return ctx; },
    get masterNode(){ return master; }
  };
})();

window.__music = Music;
const btnMusic = document.getElementById('btnMusic');

function syncMusicBtn(){
  const playing = Music.isOn();
  btnMusic.classList.toggle('on', playing);
  btnMusic.setAttribute('aria-pressed', playing ? 'true' : 'false');
}

let wakeArmed = true;
try {
  const saved = localStorage.getItem('wc-music');
  wakeArmed = saved === null ? true : saved === '1';
} catch (e) { wakeArmed = true; }

function disarmWake(){
  document.removeEventListener('pointerdown', wake);
  document.removeEventListener('keydown', wake);
  document.removeEventListener('touchstart', wake);
}

function wake(){
  disarmWake();
  if (!Music.isOn()){
    Music.toggle();
    syncMusicBtn();
    toast('背景音樂已開啟 · 點 ♪ 可關閉');
  }
}

// clicking the music button should not also trigger the "first gesture" auto start
btnMusic.addEventListener('pointerdown', disarmWake, { capture: true });
btnMusic.addEventListener('click', () => {
  const playing = Music.toggle();
  syncMusicBtn();
  toast(playing ? '背景音樂已開啟' : '背景音樂已關閉');
});

if (wakeArmed){
  document.addEventListener('pointerdown', wake, { once: true });
  document.addEventListener('keydown', wake, { once: true });
  document.addEventListener('touchstart', wake, { once: true, passive: true });
}
syncMusicBtn();

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
function render(){
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (tween){
    tween.t = Math.min(1, tween.t + dt * 1.6);
    const e = 1 - Math.pow(1 - tween.t, 3);
    camera.position.lerpVectors(tween.from, tween.to, e);
    controls.target.lerpVectors(tween.fromTarget, tween.toTarget, e);
    if (tween.t >= 1) tween = null;
  }

  // day / dusk / night transition
  const kk = 1 - Math.exp(-dt * 4.2);
  key.intensity += (targets.keyI - key.intensity) * kk;
  key.color.lerp(targets.keyC, kk);
  key.position.lerp(targets.keyPos, kk);
  fill.intensity += (targets.fillI - fill.intensity) * kk;
  fill.color.lerp(targets.fillC, kk);
  rim.intensity += (targets.rimI - rim.intensity) * kk;
  rim.color.lerp(targets.rimC, kk);
  hemi.intensity += (targets.hemiI - hemi.intensity) * kk;
  hemi.color.lerp(targets.hemiSky, kk);
  hemi.groundColor.lerp(targets.hemiGnd, kk);
  scene.environmentIntensity += (targets.env - scene.environmentIntensity) * kk;
  renderer.toneMappingExposure += (targets.exposure - renderer.toneMappingExposure) * kk;

  if (Math.abs(curGlow - targets.glow) > 0.0015){
    curGlow += (targets.glow - curGlow) * kk;
    glowMats.forEach(g => { g.m.emissiveIntensity = g.base * curGlow; });
  }
  starMat.opacity += (targets.stars - starMat.opacity) * kk;
  stars.visible = starMat.opacity > 0.01;
  moon.material.opacity += (targets.moon - moon.material.opacity) * kk;
  moon.visible = moon.material.opacity > 0.01;
  flakeMat.opacity += (targets.snowOpacity - flakeMat.opacity) * kk;
  flakeMat.color.lerp(targets.snowColor, kk);
  bounce.intensity += (targets.bounceI - bounce.intensity) * kk;
  bounce.color.lerp(targets.bounceC, kk);
  blob.material.opacity += (targets.blob - blob.material.opacity) * kk;

  const bp = window.__bloom;
  if (bp){
    bp.strength += (targets.bloomS - bp.strength) * kk;
    bp.threshold += (targets.bloomT - bp.threshold) * kk;
    bp.radius += (targets.bloomR - bp.radius) * kk;
  }

  // snow drift
  const heavySnow = snowMode === 'heavy';
  const sp = heavySnow ? 2.4 : 1.0;
  const count = heavySnow ? FLAKE_HEAVY : FLAKE_LIGHT;
  const p = flakeGeo.attributes.position.array;
  for (let i = 0; i < count; i++){
    p[i*3+1] -= spd[i] * sp * dt;
    p[i*3]   += Math.sin((p[i*3+1] + i) * 0.55) * dt * 0.25 * sp;
    if (p[i*3+1] < BOT){
      const a = Math.random() * Math.PI * 2;
      const rr = SNOW_R * Math.sqrt(Math.random());
      p[i*3+1] = TOP;
      p[i*3]   = Math.cos(a) * rr;
      p[i*3+2] = Math.sin(a) * rr;
    }
  }
  flakeGeo.attributes.position.needsUpdate = true;

  controls.update();
  render();
}
window.__viewer = {
  scene, camera, controls, renderer, key, fill, rim, hemi, stars, moon, flakeMat, flakeGeo,
  applyPreset, applySnow,
  get bloom(){ return window.__bloom; },
  get tod(){ return tod; },
  get snowMode(){ return snowMode; }
};

try {
  const saved = JSON.parse(localStorage.getItem('wc-viewer') || '{}');
  applyPreset(saved.tod || 'day', true);
  applySnow(saved.snowMode || 'light');
  if (saved.autoRotate === false){
    controls.autoRotate = false;
    btnRot.classList.remove('on');
  }
} catch (e) {
  applyPreset('day', true);
}

animate();

/* ---------------- resize ---------------- */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
});
